# Worker-only configuration. Copy to a private file and replace placeholders.
# Never copy the local .env or put passwords/tokens here.
DB_USER: "<existing-production-db-user>"
DB_NAME: "<existing-production-db-name>"
INSTANCE_UNIX_SOCKET: "/cloudsql/<project>:<region>:<instance>"
SMTP_HOST: "<actual-smtp-provider-host>"
SMTP_PORT: "587"
SMTP_FROM: "<provider-authorized-sender-address>"
SMTP_USE_TLS: "true"
SMTP_USE_SSL: "false"
WELCOME_EMAIL_DELIVERY_ENABLED: "true"
